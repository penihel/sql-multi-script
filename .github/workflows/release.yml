name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version number
        id: version
        run: |
          $v = "${{ github.event.inputs.version }}" -replace '^v', ''
          echo "number=$v" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained single-file EXE
        run: |
          dotnet publish src/FreeSQLMultiScript.UI/FreeSQLMultiScript.UI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.number }} `
            -p:AssemblyVersion=${{ steps.version.outputs.number }} `
            -p:FileVersion=${{ steps.version.outputs.number }} `
            -o ./publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: FreeSQLMultiScript ${{ github.event.inputs.version }}
          generate_release_notes: true
          files: ./publish/*.exe
